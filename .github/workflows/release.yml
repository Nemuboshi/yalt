name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 1.2.0 or v1.2.0). A release is made only when you set this."
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
    steps:
      - uses: actions/checkout@v7

      - name: Check version
        shell: bash
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${RAW_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $RAW_VERSION. Use MAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          # The version comes from Cargo.toml, so the tag and the embedded
          # version metadata can never disagree.
          declared="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [[ "$version" != "$declared" ]]; then
            echo "Requested $version but Cargo.toml declares $declared." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          name="yalt-${VERSION}-${TARGET}"
          mkdir -p "dist/${name}"
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/${TARGET}/release/yalt.exe" "dist/${name}/"
          else
            cp "target/${TARGET}/release/yalt" "dist/${name}/"
          fi
          cp docs/spec.md "dist/${name}/"
          cd dist
          if [[ "$ARCHIVE" == "zip" ]]; then
            7z a "${name}.zip" "${name}" >/dev/null
          else
            tar -czf "${name}.tar.gz" "${name}"
          fi
          rm -rf "${name}"

      - uses: actions/upload-artifact@v5
        with:
          name: yalt-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Normalize version
        shell: bash
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Accept the version with or without a leading "v"; the tag always
          # carries one, so it is stripped here rather than at each use.
          echo "VERSION=${RAW_VERSION#v}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          generate_release_notes: true
          files: dist/*

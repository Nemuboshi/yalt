name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 1.2.0 or v1.2.0). A release is made only when you set this."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check version
        shell: bash
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${RAW_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $RAW_VERSION. Use MAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Build application
        shell: bash
        run: |
          set -euo pipefail
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          wails build -platform windows/amd64 -clean -skipbindings -s \
            -ldflags "-X main.version=v${VERSION} -X main.commit=${GITHUB_SHA} -X main.date=${date}"
          mv build/bin/yalt.exe "build/bin/yalt-${VERSION}-windows-amd64.exe"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          generate_release_notes: true
          files: build/bin/*.exe

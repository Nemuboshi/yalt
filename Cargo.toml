[package]
name = "yalt"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Translate text with OpenAI-compatible Chat Completions and Responses APIs"
publish = false

[lib]
name = "yalt"
path = "src/lib.rs"

[[bin]]
name = "yalt"
path = "src/main.rs"

[dependencies]
dirs = "7.0.0"
eframe = "0.36"
egui_commonmark = { version = "0.25", default-features = false, features = ["pulldown_cmark"] }
fontdb = "0.24"
image = { version = "0.25.10", default-features = false, features = ["png"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "charset", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
ttf-parser = "0.25"
# Language detection. whatlang links its models unconditionally, so no feature
# list is needed to keep the binary small; it costs well under a megabyte.
whatlang = { version = "0.18", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"

# Keep debug artifacts small. The dependency graph is large (the language
# detector alone carries 74 models), and full debug info for all of it costs
# more disk and link time than it is worth for dependencies we do not debug.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The tray has no backend on Linux, so the crate is not built there at all:
# both of its backends need either GTK with libappindicator or a session D-Bus
# service, and neither can be assumed on a machine that must run regardless.
# See `crate::tray` for the behavior when no tray is available.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = "0.26.1"

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1.34"

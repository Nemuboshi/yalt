[package]
name = "yalt"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Translate text with OpenAI-compatible Chat Completions and Responses APIs"
publish = false

[lib]
name = "yalt"
path = "src/lib.rs"

[[bin]]
name = "yalt"
path = "src/main.rs"

[dependencies]
dirs = "7.0.0"
eframe = "0.36"
egui = "0.36"
image = { version = "0.25.10", default-features = false, features = ["png"] }
lingua = "1.8"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "charset", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
tempfile = "3.27.0"

# Keep debug artifacts small: the dependency graph (74 language models plus
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = "0.26.1"

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1.34"
